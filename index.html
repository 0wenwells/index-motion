<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>index.motion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Single theme: white linework and type on black. Layout: Redesign V1 grid. Narrow index column (decades) + three content columns, hairline rules, one regular-weight grotesk in black. */
:root {
  --paper: #000000;
  --ink: #ffffff;
  --ink-2: #9a9a9a;
  --hair: #ffffff;
  --gap: #4d4d4d;
  color-scheme: dark;
  --f: "Aktiv Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --s-small: 11px;   /* source 2 — 8pt */
  --s-body: 11px;    /* everything at description size */
  --s-head: 11px;
  --s-tiny: 9px;     /* matches the year labels on the timeline */
  --indent: 12px;
  --rule: 0.5px solid var(--hair);
}

body { background: var(--paper); color: var(--ink); font-family: var(--f); font-weight: 400; font-size: var(--s-body); line-height: 1.3; }
#app {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
.up { text-transform: uppercase; }
.small { font-size: var(--s-small); line-height: 1.35; }
.muted { color: var(--ink-2); }

/* Grid: index column 1/8, content 7/8 */
.grid { display: grid; grid-template-columns: 12.5% minmax(0, 1fr); }
header.grid { padding-bottom: 24px; align-items: start; }
header .name { font-size: var(--s-body); }
header .sub { padding-left: var(--indent); max-width: 32ch; }

.body { align-items: start; }
.index { padding-right: 16px; }
.index ol { list-style: none; margin: 0; padding: 0; }
.index li { border-bottom: var(--rule); }
.index .add-row { border-bottom: 0; }
.index button { display: flex; justify-content: space-between; gap: 6px; width: 100%; padding: 6px 0 7px; }
.index button[aria-current="true"] { text-decoration: underline; text-underline-offset: 3px; }
.index .n { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.index .add-row button { padding-top: 22px; }

.content { min-width: 0; }
.lineband { border-bottom: var(--rule); padding: 9px var(--indent) 10px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Strip: one column per decade, newest on the left, scrolls sideways */
.strip { position: relative; padding-top: 0; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; }
.row { display: flex; align-items: flex-start; padding-right: calc(100% - 260px); }
/* each decade's rule drops from the timeline, not from the top */
.dec { flex: 0 0 260px; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; }
.dec + .dec::before { content: ""; position: absolute; left: 0; top: calc(var(--axis, 40px) + 10px); bottom: 0; border-left: var(--rule); }
.dec.empty { flex-basis: 96px; color: var(--ink-2); }
.dec-head { display: flex; justify-content: space-between; gap: 8px; padding: 9px var(--indent) 10px; border-bottom: var(--rule); }
.dec-head .n { font-size: var(--s-small); color: var(--ink-2); }
.ruler { padding: 10px 0 0; }
svg { display: block; width: 100%; height: auto; }
.ax { font-family: var(--f); font-size: 9px; fill: var(--ink-2); }
.ax-strong { font-family: var(--f); font-size: 9px; fill: var(--ink); }
.dot { cursor: pointer; }
.dot:focus { outline: none; }
.dot:focus-visible circle, .dot.sel circle { fill: var(--paper); stroke: var(--ink); stroke-width: 1.25; }
.none { font-size: var(--s-small); padding: 10px var(--indent) 0; margin: 0; }

.works { list-style: none; margin: 0; padding: 4px 0 0; }
.work:last-child { padding-bottom: 0; }
.work { padding: 10px var(--indent); font-size: var(--s-small); line-height: 1.35; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 0 6px; }
.work:hover .t { text-decoration: underline; text-underline-offset: 2px; }
.work .y { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: var(--s-tiny); line-height: 15px; }
.work .m { color: var(--ink-2); font-size: var(--s-tiny); }
.work p { margin: 4px 0 0; color: var(--ink-2); font-size: var(--s-tiny); }
.work .links { display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap; }
.work .links a, .work .links button { font-size: var(--s-tiny); color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
.work.sel { background: var(--ink); color: var(--paper); }
.work.sel .y, .work.sel .m, .work.sel p, .work.sel .links a, .work.sel .links button { color: var(--paper); }

/* Rollover player: opens on hover, stays put until closed */
#peek { position: absolute; z-index: 20; width: 420px; max-width: calc(100vw - 32px); background: var(--paper); border: var(--rule); }
#peek .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 0 0 10px; border-bottom: var(--rule); font-size: var(--s-small); }
#peek .bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#peek .x { flex: 0 0 auto; width: 26px; height: 26px; position: relative; border-left: var(--rule); }
#peek .x::before, #peek .x::after { content: ""; position: absolute; left: 7px; right: 7px; top: 50%; border-top: 1px solid var(--ink); }
#peek .x::before { transform: rotate(45deg); }
#peek .x::after { transform: rotate(-45deg); }
#peek .x:hover { background: var(--ink); }
#peek .x:hover::before, #peek .x:hover::after { border-color: var(--paper); }
#peek .frame { aspect-ratio: 16 / 9; background: #000; }
#peek iframe { width: 100%; height: 100%; border: 0; display: block; }
.work .t.playable { cursor: pointer; }
.work .t.playable::after { content: " \25B8"; color: var(--ink-2); }

/* Form */
.form { border-bottom: var(--rule); padding: 16px var(--indent) 20px; }
form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 24px; }
.field { display: grid; gap: 4px; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: var(--s-small); text-transform: uppercase; }
input, textarea { font: inherit; font-size: var(--s-body); color: var(--ink); background: transparent; border: 0; border-bottom: var(--rule); border-radius: 0; padding: 4px 0 6px; width: 100%; box-sizing: border-box; }
input:focus, textarea:focus { outline: none; border-bottom: 1.5px solid var(--ink); }
textarea { resize: vertical; min-height: 44px; }
.formacts { grid-column: 1 / -1; display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
.formacts button { text-decoration: underline; text-underline-offset: 3px; }
.formacts button:disabled { opacity: 0.4; cursor: default; }
.msg { margin: 0; font-size: var(--s-small); color: var(--ink-2); }

@media (max-width: 900px) { form { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .grid { grid-template-columns: 1fr; }
  header .sub { padding-left: 0; margin-top: 6px; }
  .index { padding-right: 0; margin-bottom: 16px; }
  .index ol { display: flex; flex-wrap: wrap; }
  .index li { border-bottom: 0; }
  .row { padding-right: 0; }
  .index button { padding: 6px 14px 6px 0; }
  .index .add-row button { padding-top: 8px; }
  .index .n { display: none; }
  .dec { flex-basis: 240px; }
  form { grid-template-columns: 1fr; }
}
</style>

</head>
<body>
<div id="app">
  <header class="grid">
    <div class="name">index.motion</div>
    <div class="sub">A working index of motion design</div>
  </header>

  <div class="grid body">
    <nav class="index" aria-label="Decades">
      <ol id="decades"></ol>
      <ol><li class="add-row" id="add-row"><button type="button" id="add-btn">+ Add a work</button></li></ol>
    </nav>

    <main class="content">
      <section class="form" id="form-wrap" hidden>
        <form id="form" novalidate>
          <div class="field"><label for="f-title">Title</label><input id="f-title" required autocomplete="off"></div>
          <div class="field"><label for="f-year">Year</label><input id="f-year" inputmode="numeric" required autocomplete="off"></div>
          <div class="field"><label for="f-maker">Made by</label><input id="f-maker" autocomplete="off"></div>
          <div class="field"><label for="f-url">Link</label><input id="f-url" type="url" autocomplete="off" placeholder="https://vimeo.com/…"></div>
          <div class="field"><label for="f-tags">Tags</label><input id="f-tags" autocomplete="off" placeholder="title sequence, kinetic type"></div>
          <div class="field"></div>
          <div class="field wide"><label for="f-note">Why it's here</label><textarea id="f-note"></textarea></div>
          <div class="formacts">
            <button type="submit" id="f-submit">Add to record</button>
            <button type="button" id="f-cancel">Cancel</button>
            <p class="msg" id="msg" role="status"></p>
          </div>
        </form>
      </section>
      <div class="strip" id="strip" tabindex="0" aria-label="Timeline, newest on the left. Scroll sideways for older decades."><div class="row" id="row"></div></div>
    </main>
  </div>
</div>


<script id="main">
(function () {
  "use strict";
  var PRISTINE_APP = document.getElementById("app").outerHTML;
  var NOW_YEAR = 2026;

  var works = [];

  var state = { dec: null, sel: null, editing: null, canEdit: false, busy: false, pendingDelete: null };
  var artifactApi = null, noArtifact = false;

  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) { var n = document.createElementNS(SVGNS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
  function h(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function byYear(a, b) { return b.year - a.year || a.title.localeCompare(b.title); }

  function domain() {
    if (!works.length) return [1920, NOW_YEAR];
    var mn = Math.min.apply(null, works.map(function (w) { return w.year; }));
    return [Math.floor(mn / 10) * 10, NOW_YEAR];
  }
  function decades() {
    var d = domain(), out = [];
    for (var dec = Math.floor(NOW_YEAR / 10) * 10; dec >= d[0]; dec -= 10) {
      out.push({ dec: dec, list: works.filter(function (w) { return w.year >= dec && w.year <= dec + 9; }).sort(byYear) });
    }
    return out;
  }

  // ---------- Index column: jumps the strip to a decade ----------
  function renderIndex() {
    var ol = $("decades"); ol.textContent = "";
    decades().forEach(function (d) {
      var li = h("li"), b = h("button"); b.type = "button";
      b.appendChild(h("span", null, d.dec + "s"));
      b.appendChild(h("span", "n", String(d.list.length)));
      b.setAttribute("aria-current", state.dec === d.dec ? "true" : "false");
      b.addEventListener("click", function () { state.dec = d.dec; renderIndex(); jumpTo(d.dec); });
      li.appendChild(b); ol.appendChild(li);
    });
  }
  function jumpTo(dec) {
    var col = $("d-" + dec), strip = $("strip");
    if (!col) return;
    strip.scrollTo({ left: col.offsetLeft, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  // ---------- Rollover player (Vimeo / YouTube) ----------
  function embedUrl(url) {
    if (!url) return null;
    var m = url.match(/vimeo\.com\/(?:.*\/)?(\d{5,})/);
    if (m) return "https://player.vimeo.com/video/" + m[1] + "?autoplay=1&muted=1&loop=1&title=0&byline=0&portrait=0&dnt=1";
    m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    if (m) return "https://www.youtube-nocookie.com/embed/" + m[1] + "?autoplay=1&mute=1&loop=1&playlist=" + m[1] + "&controls=1&playsinline=1";
    return null;
  }
  var peek = null, peekTimer = null, peekSrc = null, canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
  function hidePeek() { clearTimeout(peekTimer); if (peek) { peek.remove(); peek = null; peekSrc = null; } }
  function openPeek(node, src) {
    if (peek && peekSrc === src) return;
    hidePeek();
    peek = document.createElement("div"); peek.id = "peek"; peekSrc = src;
    var bar = document.createElement("div"); bar.className = "bar";
    var label = document.createElement("span"); label.textContent = node.textContent;
    var x = document.createElement("button"); x.type = "button"; x.className = "x"; x.setAttribute("aria-label", "Close video");
    x.addEventListener("click", hidePeek);
    bar.appendChild(label); bar.appendChild(x);
    var frame = document.createElement("div"); frame.className = "frame";
    var f = document.createElement("iframe");
    f.src = src; f.title = node.textContent;
    f.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media"; f.allowFullscreen = true;
    frame.appendChild(f); peek.appendChild(bar); peek.appendChild(frame);
    document.body.appendChild(peek);
    // pin beside the title, kept inside the window
    var r = node.getBoundingClientRect(), w = peek.offsetWidth, hgt = peek.offsetHeight;
    var x0 = r.left, y0 = r.bottom + 8;
    if (x0 + w > innerWidth - 16) x0 = innerWidth - 16 - w;
    if (y0 + hgt > innerHeight - 16) y0 = Math.max(16, r.top - hgt - 8);
    peek.style.left = (Math.max(16, x0) + scrollX) + "px"; peek.style.top = (y0 + scrollY) + "px";
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") hidePeek(); });
  function attachPeek(node, url) {
    var src = embedUrl(url);
    if (!src) return;
    node.classList.add("playable");
    if (canHover) {
      node.addEventListener("mouseenter", function () { clearTimeout(peekTimer); peekTimer = setTimeout(function () { openPeek(node, src); }, 300); });
      node.addEventListener("mouseleave", function () { clearTimeout(peekTimer); });
    }
    node.addEventListener("click", function () { clearTimeout(peekTimer); openPeek(node, src); });
  }

  // ---------- Strip ----------
  function ruler(dec, list, W, axisY) {
    // ten years, newest on the left, dots stacked per year
    var stacks = {}; list.forEach(function (w) { (stacks[w.year] = stacks[w.year] || []).push(w); });
    var x0 = 0, x1 = W, rad = RAD, gapV = GAPV, H = axisY + 16;
    var sx = function (y) { return x1 - (y - dec) / 10 * (x1 - x0); }; // y = start of year
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "group", "aria-label": dec + "s, " + list.length + " works" });
    el("line", { x1: x0, x2: x1, y1: axisY, y2: axisY, stroke: "var(--hair)", "stroke-width": 0.5 }, svg);
    for (var y = dec; y <= dec + 9; y++) {
      if (y > NOW_YEAR) continue;
      var tx = sx(y), isDec = y === dec, mid = y === dec + 5;
      if (!isDec) el("line", { x1: tx, x2: tx, y1: axisY, y2: axisY + (mid ? 5 : 3), stroke: "var(--hair)", "stroke-width": 0.5 }, svg);
      if (isDec) el("text", { x: W - 4, y: axisY + 13, "text-anchor": "end", class: "ax-strong" }, svg).textContent = y;
      else if (mid && W > 150) el("text", { x: tx, y: axisY + 13, "text-anchor": "middle", class: "ax" }, svg).textContent = y;
    }
    Object.keys(stacks).forEach(function (yk) {
      stacks[yk].forEach(function (w, i) {
        var g = el("g", { class: "dot" + (state.sel === w.id ? " sel" : ""), tabindex: 0, role: "button", "aria-label": w.year + ", " + w.title }, svg);
        el("title", {}, g).textContent = w.year + " · " + w.title + (w.maker ? " — " + w.maker : "");
        el("circle", { cx: sx(w.year + 0.5), cy: axisY - 4 - rad - i * gapV, r: rad, fill: "var(--ink)" }, g);
        var pick = function () { select(w.id); };
        g.addEventListener("click", pick);
        g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
      });
    });
    return svg;
  }

  var RAD = 3.5, GAPV = RAD * 2 + 2.5;
  function renderStrip() {
    var row = $("row"), keep = $("strip").scrollLeft; row.textContent = "";
    // one shared baseline so the ruler runs unbroken across every decade
    var per = {}, gMax = 1; works.forEach(function (w) { per[w.year] = (per[w.year] || 0) + 1; gMax = Math.max(gMax, per[w.year]); });
    var axisY = Math.max(22, gMax * GAPV + 10);
    row.style.setProperty("--axis", axisY + "px");
    decades().forEach(function (d) {
      var col = h("section", "dec" + (d.list.length ? "" : " empty")); col.id = "d-" + d.dec;
      if (!d.list.length) {
        var r0 = h("div", "ruler"); r0.appendChild(ruler(d.dec, [], 96, axisY)); col.appendChild(r0);
        col.appendChild(h("p", "none", "Nothing recorded"));
        row.appendChild(col); return;
      }
      var r = h("div", "ruler"); r.appendChild(ruler(d.dec, d.list, 260, axisY)); col.appendChild(r);
      var ol = h("ol", "works");
      d.list.forEach(function (w) {
        var li = h("li", "work" + (state.sel === w.id ? " sel" : "")); li.id = "w-" + w.id;
        li.appendChild(h("span", "y", String(w.year)));
        var body = h("div"); body.style.minWidth = "0";
        var t = h("div", "t", w.title); body.appendChild(t);
        attachPeek(t, w.url);
        if (w.maker) body.appendChild(h("div", "m", w.maker));
        if (w.note) body.appendChild(h("p", null, w.note));
        var links = h("div", "links");
        var a = document.createElement("a"); a.target = "_blank"; a.rel = "noopener";
        if (w.url) { a.href = w.url; a.textContent = "Watch ↗"; }
        else { a.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(w.title.replace(/\s*\(titles\)\s*/i, " titles ").trim() + " " + (w.maker || "")); a.textContent = "Find on YouTube ↗"; }
        a.addEventListener("click", function (e) { e.stopPropagation(); });
        links.appendChild(a);
        if (state.canEdit !== false) {
          var eb = h("button", null, "Edit"); eb.type = "button";
          eb.addEventListener("click", function (e) { e.stopPropagation(); openForm(w); });
          var del = h("button", null, state.pendingDelete === w.id ? "Confirm remove" : "Remove"); del.type = "button";
          del.addEventListener("click", function (e) {
            e.stopPropagation();
            if (state.pendingDelete === w.id) { state.pendingDelete = null; save(works.filter(function (x) { return x.id !== w.id; }), "Removed."); }
            else { state.pendingDelete = w.id; renderStrip(); }
          });
          links.appendChild(eb); links.appendChild(del);
        }
        body.appendChild(links);
        li.appendChild(body);
        li.addEventListener("click", function () { select(w.id); });
        ol.appendChild(li);
      });
      col.appendChild(ol);
      row.appendChild(col);
    });
    $("strip").scrollLeft = keep;
  }

  function select(id) {
    state.sel = state.sel === id ? null : id;
    renderStrip();
    var n = state.sel && $("w-" + id);
    if (n) n.scrollIntoView({ block: "nearest", inline: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  // ---------- Form ----------
  function msg(t) { $("msg").textContent = t || ""; }
  function openForm(w) {
    state.editing = w ? w.id : null;
    $("f-title").value = w ? w.title : ""; $("f-year").value = w ? w.year : ""; $("f-maker").value = w ? (w.maker || "") : "";
    $("f-url").value = w ? (w.url || "") : ""; $("f-tags").value = w ? (w.tags || []).join(", ") : ""; $("f-note").value = w ? (w.note || "") : "";
    $("f-submit").textContent = w ? "Save changes" : "Add to record";
    $("form-wrap").hidden = false; msg(""); $("f-title").focus();
    $("form-wrap").scrollIntoView({ block: "nearest" });
  }
  function closeForm() { state.editing = null; $("form-wrap").hidden = true; msg(""); }
  $("add-btn").addEventListener("click", function () { if (!$("form-wrap").hidden && !state.editing) closeForm(); else openForm(null); });
  $("f-cancel").addEventListener("click", closeForm);
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (state.busy) return;
    var title = $("f-title").value.trim(), year = parseInt($("f-year").value.trim(), 10), url = $("f-url").value.trim();
    if (!title) { msg("Add a title."); $("f-title").focus(); return; }
    if (!(year >= 1880 && year <= NOW_YEAR)) { msg("Year must be between 1880 and " + NOW_YEAR + "."); $("f-year").focus(); return; }
    if (url && !/^https?:\/\//i.test(url)) { msg("Links need to start with https://"); $("f-url").focus(); return; }
    var tags = $("f-tags").value.split(",").map(function (t) { return t.trim().toLowerCase(); }).filter(Boolean);
    tags = tags.filter(function (t, i) { return tags.indexOf(t) === i; });
    var item = { id: state.editing || ("w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), title: title, maker: $("f-maker").value.trim(), year: year, url: url, tags: tags, note: $("f-note").value.trim() };
    var next = state.editing ? works.map(function (w) { return w.id === state.editing ? item : w; }) : works.concat([item]);
    save(next, state.editing ? "Saved." : "Added " + title + " (" + year + ").", item.id);
  });

  // ---------- Saving: the page republishes itself with the new record ----------
  function buildHtml(list) {
    var json = ("[\n" + list.map(function (w) { return JSON.stringify(w); }).join(",\n") + "\n]").replace(/</g, "\\u003c");
    var parts = [];
    document.querySelectorAll("[data-keep]").forEach(function (n) {
      if (n.id === "app") parts.push(PRISTINE_APP);
      else if (n.id === "data") parts.push('<script type="application/json" id="data">\n' + json + "\n<\/script>");
      else parts.push(n.outerHTML);
    });
    var reset = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + "</style></head><body>" + parts.join("\n") + "</body></html>";
  }
  function save(next, okText, selId) {
    if (!artifactApi) { msg("Saving isn't available in this view. Open the page on claude.ai to edit."); return; }
    state.busy = true; $("f-submit").disabled = true; msg("Saving…");
    artifactApi.publish(buildHtml(next)).then(function () {
      works = next; state.busy = false; $("f-submit").disabled = false;
      closeForm(); if (selId) state.sel = selId; renderAll(); msg(okText);
      if (selId) { var dec = Math.floor((next.filter(function (w) { return w.id === selId; })[0] || {}).year / 10) * 10; if (dec) jumpTo(dec); }
    }).catch(function (err) {
      state.busy = false; $("f-submit").disabled = false;
      var code = err && err.code;
      if (code === "conflict") msg("Someone else saved at the same moment. The page will reload with their version; add this again.");
      else if (code === "not_writer" || code === "not_granted") { state.canEdit = false; applyEditState(); }
      else if (code === "rate_limited") msg("Too many saves in a row. Wait a few seconds and try again.");
      else msg("Couldn't save (" + (code || "unknown error") + "). Try again.");
    });
  }
  function applyEditState() {
    var ro = state.canEdit === false;
    $("add-row").hidden = ro; if (ro) $("form-wrap").hidden = true;
    renderStrip();
  }

  function renderAll() { renderIndex(); renderStrip(); }
  // Read-only site: the list of works lives in works.json next to this page.
  $("add-row").hidden = true;
  fetch("works.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (list) {
    works = (list || []).filter(function (w) { return w && typeof w.year === "number" && w.title; });
    renderAll();
  }).catch(function () {
    $("row").textContent = "Couldn't load works.json. Check it sits next to index.html and is valid JSON.";
  });

})();
</script>
</body>
</html>
