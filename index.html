<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index.motion</title>
<!-- FONT: Aktiv Grotesk via Adobe Fonts (same kit as index.ai) -->
<link rel="stylesheet" href="https://use.typekit.net/onp4cuh.css">
<style>
/* Single theme: white linework and type on black.
   System: Specimen 01, scale A. Four type roles on a 6px baseline;
   every line-height and vertical gap is a multiple of 6. */
:root {
  color-scheme: dark;

  /* Colour — contrast on black in brackets */
  --paper: #000000;
  --ink:   #ffffff;   /* 21.0 : 1  titles, active state */
  --ink-2: #9a9a9a;   /*  7.5 : 1  notes, makers, meta */
  --ink-3: #6b6b6b;   /*  3.9 : 1  counts, zero states, ghost dots (was #4d4d4d) */
  --ink-4: #3a3a3a;   /*  1.8 : 1  soft rules only, never text */
  --hair:  #ffffff;
  --rule:  0.5px solid var(--hair);
  --rule-soft: 0.5px solid var(--ink-4);   /* dividers that separate without framing */

  /* Type — role: size / line-height */
  --f: "aktiv-grotesk", "Aktiv Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --s-meta:  9px;  --l-meta:  12px;   /* years, makers, counts, axis labels */
  --s-body:  12px; --l-body:  18px;   /* notes, navigation */
  --s-title: 18px; --l-title: 24px;   /* work titles */

  /* Space */
  --u: 6px;           /* baseline half-unit */
  --indent: 12px;
  --col: 312px;       /* one decade column — keep in step with COL in the script */
  --col-empty: 96px;  /* a decade with no works */
  --col-wide: 936px;  /* a decade column while its video plays: three columns */

  /* Motion */
  --dur: 360ms;       /* layout changes: column widening, dimming */
  --dur-fast: 160ms;  /* small marks: the menu arrowhead */
}
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-size: var(--s-body); line-height: var(--l-body); }
[hidden] { display: none !important; }
#app {
  max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 72px;
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 0.5px solid var(--ink-3); outline-offset: 3px; }   /* keyboard focus: a fine grey line, not a white box */
.strip:focus-visible { outline: none; }   /* the timeline itself takes focus only for arrow-key scrolling; framing the whole page is too much */

/* Top: one line — name, subtitle, then the menus pushed to the right. No outlines. */
.mast { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; }
.mast .sub { color: var(--ink-2); }
.nav { display: flex; flex-wrap: wrap; gap: 0 24px; margin-left: auto; }
.status { margin: 6px 0 0; color: var(--ink-2); }

/* Dropdown: native <details>, one open at a time */
.dd { position: relative; }
.dd summary { list-style: none; display: flex; gap: 6px; align-items: baseline; cursor: pointer; white-space: nowrap; color: var(--ink-2); }
.dd summary::-webkit-details-marker { display: none; }
/* Menu marker, drawn in the timeline's cross line. Closed: an arrowhead pointing back at the label
   (the right half of a cross). Open: it turns 90° anticlockwise while the left half grows, and becomes the ×. */
.mk { flex: 0 0 auto; align-self: center; width: 9px; height: 9px; overflow: visible;
      transition: transform var(--dur-fast) cubic-bezier(0.4, 0, 0.2, 1); }
.mk path { fill: none; stroke: currentColor; stroke-width: 0.75; vector-effect: non-scaling-stroke;
           transform-box: view-box; transform-origin: center; }
.mk .l { transform: scale(0); transition: transform var(--dur-fast) cubic-bezier(0.4, 0, 0.2, 1); }
.dd[open] .mk { transform: rotate(-90deg); }   /* anticlockwise: the point turns down towards the panel; closing turns it back clockwise */
.dd[open] .mk .l { transform: scale(1); }
@media (prefers-reduced-motion: reduce) { .mk, .mk .l { transition: none; } }
.dd summary .v { color: var(--ink); font-size: var(--s-meta); font-variant-numeric: tabular-nums; }   /* active state shows in white */
.dd summary:hover, .dd[open] summary { color: var(--ink); }
.panel { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; min-width: 264px; max-height: min(60vh, 540px); overflow-y: auto; margin: 0; padding: 0 var(--indent); list-style: none; background: rgba(0, 0, 0, 0.94); }   /* dark veil, no frame: the timeline shows faintly through */
.panel li + li { border-top: 0.5px solid var(--ink-4); }
.panel button { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 6px 0; }
.panel button { color: var(--ink-2); }   /* state by colour: grey, white when chosen or hovered */
.panel button[aria-pressed="true"], .panel button:hover { color: var(--ink); }
.panel .n { color: var(--ink-2); font-size: var(--s-meta); font-variant-numeric: tabular-nums; }
.panel .zero { color: var(--ink-3); }
.view { display: flex; gap: 12px; }
.view button { color: var(--ink-2); }
.view button[aria-pressed="true"] { color: var(--ink); }
.view button:hover { color: var(--ink); }
/* Active filters: one line under the title, each removable in one click */
.active { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-top: 12px; font-size: var(--s-meta); line-height: var(--l-meta); color: var(--ink-2); }
.active .chip { color: var(--ink); }
.active .chip::after { content: "\00a0\00d7"; color: var(--ink-2); }   /* × */
.active .chip:hover { color: var(--ink-2); }
.active .clear { color: var(--ink-2); }
.active .clear:hover, .active .chip:hover::after { color: var(--ink); }

/* Strip: one column per decade, newest on the left, scrolls sideways */
.content { min-width: 0; padding-top: 24px; }
.strip { position: relative; overflow-x: auto; overscroll-behavior-x: contain; }   /* no scroll-snap: it re-snaps after every layout change and makes the viewer jump */
.row { display: flex; align-items: stretch; padding-right: calc(100% - var(--col)); }   /* stretch: every decade rule ends at the same line */
.dec { flex: 0 0 var(--col); display: flex; flex-direction: column; position: relative; }
.dec + .dec::before { content: ""; position: absolute; left: 0; top: calc(var(--axis, 40px) + 10px); bottom: 0; border-left: var(--rule-soft); }
.dec.empty { flex-basis: var(--col-empty); color: var(--ink-2); }
.ruler { padding: 10px 0 0; }
svg { display: block; width: 100%; height: auto; }
.ax { font-family: var(--f); font-size: var(--s-meta); fill: var(--ink-2); }
.ax-strong { font-family: var(--f); font-size: var(--s-meta); fill: var(--ink); }
.dot { cursor: pointer; }
.dot:focus { outline: none; }
.dot .x { stroke: var(--ink-2); stroke-width: 0.75; fill: none; }   /* a small cross marks each work on the axis */
.dot:hover .x, .dot:focus-visible .x, .dot.sel .x { stroke: var(--ink); stroke-width: 1.25; }
.ghost { stroke: var(--ink-4); stroke-width: 0.75; fill: none; }   /* filtered-out works */
.none { padding: 10px var(--indent) 0; margin: 0; }

.works { list-style: none; margin: 0; padding: 6px 0 0; }
.work { padding: 12px var(--indent); cursor: pointer; display: grid; grid-template-columns: 4ch minmax(0, 1fr); gap: 0 12px; }
.work:last-child { padding-bottom: 0; }
.work:hover p, .work:hover .m, .work.sel p, .work.sel .m,
.work:focus-visible p, .work:focus-visible .m { color: var(--ink); }   /* hover or keyboard focus lifts the whole entry to white */
.work:not(.img):focus-visible { outline: none; }
.work .y { font-size: var(--s-meta); line-height: var(--l-title); font-variant-numeric: tabular-nums; color: var(--ink-2); }   /* sits on the title's line */
.work .t { font-size: var(--s-title); line-height: var(--l-title); }
.work .m { margin-top: 6px; font-size: var(--s-meta); line-height: var(--l-meta); color: var(--ink-2); }   /* half-unit between title and maker */
.work p { margin: 6px 0 0; color: var(--ink-2); }
/* Image view */
.work.img { display: block; padding: 6px var(--indent); }
.work.img:focus-visible { outline: none; }
.thumb { position: relative; aspect-ratio: 40 / 9; overflow: hidden; background: #0d0d0d; }   /* 2/5 the height of a 16:9 still */
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }   /* the band shown is the vertical centre of the frame */
.fallback { position: absolute; inset: 0; display: grid; grid-template-columns: 4ch minmax(0, 1fr); gap: 0 12px; align-content: center; padding: 0 12px; border: 0.5px solid var(--ink-4); }
.fallback .y { font-size: var(--s-meta); line-height: var(--l-body); color: var(--ink-3); }
.fallback .ft { color: var(--ink-3); }
.info { position: absolute; inset: 0; padding: 0 12px; overflow: hidden; background: rgba(0, 0, 0, 0.86); opacity: 0; transition: opacity 120ms; display: grid; grid-template-columns: 4ch minmax(0, 1fr); gap: 0 12px; align-content: center; }   /* the band is short: title and maker only, centred */
.info > :not(.y) { grid-column: 2; }
.info .y { grid-row: 1; font-size: var(--s-meta); line-height: var(--l-title); color: var(--ink-2); }
.info .t { grid-row: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info p { display: none; }   /* the note shows under the player once it opens */
.work.img:hover .info, .work.img:focus-within .info, .work.img:focus-visible .info, .work.img.sel .info { opacity: 1; }
.work.img:focus-visible .thumb { outline: 0.5px solid var(--ink-3); outline-offset: 3px; }
@media (hover: none) { .info { opacity: 1; background: linear-gradient(transparent 30%, rgba(0, 0, 0, 0.9)); align-content: end; } .info p { display: none; } }
@media (prefers-reduced-motion: reduce) { .info { transition: none; } }

.work .t.playable::after { content: "\00a0\25B8"; color: var(--ink-2); }   /* non-breaking: the marker never sits alone on a line */

/* Viewer: the playing work's decade column widens, everything else dims */
.dec { transition: flex-basis var(--dur) cubic-bezier(0.4, 0, 0.2, 1), opacity var(--dur) cubic-bezier(0.4, 0, 0.2, 1); }
.dec.wide { flex-basis: min(var(--col-wide), calc(100vw - 32px)); }
.dec.wide .ruler { position: relative; }
.dec.wide .ruler svg { width: var(--col); }   /* the axis keeps its scale; a plain rule carries it across the extra width */
.dec.wide .ruler::after { content: ""; position: absolute; left: var(--col); right: 0; top: calc(10px + var(--axis, 40px)); border-top: var(--rule); }
.top, .work { transition: opacity var(--dur) cubic-bezier(0.4, 0, 0.2, 1); }
.theatre .top, .theatre .dec:not(.wide), .theatre .work:not(.playing), .theatre .dec.wide .ruler { opacity: 0.15; }
.player { margin-top: 12px; cursor: default; }   /* no frame: the dimmed page already sets it apart */
.player .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 0 6px; font-size: var(--s-meta); line-height: var(--l-meta); color: var(--ink-2); }
.player .bar span { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* a long title shortens; it can no longer push the × out of view */
.player .x { flex: 0 0 auto; display: grid; place-items: center; width: 24px; height: 24px; margin-right: -7.5px; color: var(--ink-2); }   /* 24px target; the 9px cross sits flush with the player's right edge */
.player .x svg { width: 9px; height: 9px; overflow: visible; }
.player .x path { fill: none; stroke: currentColor; stroke-width: 0.75; vector-effect: non-scaling-stroke; }   /* same line as the timeline and menu crosses */
.player .x:hover { color: var(--ink); }
.player .frame { aspect-ratio: 16 / 9; background: #000; }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.work.img.playing .player { margin-top: 0; }
.work.img .cap { display: grid; grid-template-columns: 4ch minmax(0, 1fr); gap: 0 12px; margin-top: 6px; color: var(--ink-2); }
.work.img .cap .y { font-size: var(--s-meta); line-height: var(--l-body); }
@media (prefers-reduced-motion: reduce) { .dec, .top, .work { transition: none; } }

@media (max-width: 640px) {
  .mast { position: relative; }
  .nav { margin-left: 0; width: 100%; }
  .dd { position: static; }
  .panel { left: 0; right: 0; min-width: 0; }
  .row { padding-right: 0; }
  .dec { flex-basis: 240px; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="mast">
      <div>index.motion</div>
      <div class="sub">A working index of motion design</div>
      <nav class="nav" id="nav" aria-label="Decades and filters"></nav>
    </div>
    <div class="active" id="active" hidden></div>
    <p class="status" id="status" hidden></p>
  </header>

  <main class="content">
    <div class="strip" id="strip" tabindex="0" aria-label="Timeline, newest on the left. Scroll sideways for older decades."><div class="row" id="row"></div></div>
  </main>
</div>

<script>
/* ======================================================================
   SETTINGS
   SHEET_CSV: paste the "Publish to web" CSV link of your Google Sheet
   between the quotes. Leave it empty to use works.json instead.
   ====================================================================== */
var SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS49s7kef_5-QOWQVRwcCTCbMn9Hut7tlFV-Z44L3AzkKCOBpbAM8XKHwMPH9Kr830M_dlkUsZY3jIS/pub?gid=743030809&single=true&output=csv";

(function () {
  "use strict";
  var NOW_YEAR = new Date().getFullYear();
  var FACETS = [
    { key: "type", label: "Type" },
    { key: "medium", label: "Medium" },
    { key: "focus", label: "Focus" }
  ];

  var works = [];
  var state = { dec: null, sel: null, playing: null, view: "list", filters: { type: new Set(), medium: new Set(), focus: new Set() } };
  try { if (localStorage.getItem("im-view") === "images") state.view = "images"; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) { var n = document.createElementNS(SVGNS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
  function h(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function byYear(a, b) { return b.year - a.year || a.title.localeCompare(b.title); }

  // ---------- Loading: Google Sheet (CSV) or works.json ----------
  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  var HEAD = { year: "year", title: "title", madeby: "maker", maker: "maker", type: "type", medium: "medium", focus: "focus", link: "url", url: "url", note: "note", notes: "note", description: "note", image: "image", thumbnail: "image", still: "image" };
  function fromCSV(text) {
    var rows = parseCSV(text);
    if (!rows.length) return [];
    var cols = rows[0].map(function (hd) { return HEAD[String(hd).toLowerCase().replace(/[^a-z]/g, "")] || null; });
    return rows.slice(1).map(function (r, i) {
      var o = { id: "r" + (i + 2) };
      cols.forEach(function (k, j) { if (k) o[k] = (r[j] || "").trim(); });
      return o;
    });
  }
  function clean(list) {
    return list.map(function (w, i) {
      var y = parseInt(w.year, 10);
      return {
        id: String(w.id || "w" + i), year: y, title: String(w.title || "").trim(), maker: String(w.maker || "").trim(),
        type: String(w.type || "").trim(), medium: String(w.medium || "").trim(), focus: String(w.focus || "").trim(),
        url: String(w.url || "").trim(), note: String(w.note || "").trim(), image: String(w.image || "").trim()
      };
    }).filter(function (w) { return w.title && w.year >= 1800 && w.year <= NOW_YEAR; });
  }
  function loadJSON() { return fetch("works.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }
  function load() {
    var p = SHEET_CSV
      ? fetch(SHEET_CSV, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(fromCSV)
          .catch(function () { status("Couldn't read the spreadsheet, showing works.json instead."); return loadJSON(); })
      : loadJSON();
    p.then(function (list) { works = clean(list || []); renderAll(); })
     .catch(function () { $("row").textContent = "Couldn't load the list of works. If you're using works.json, check it sits next to index.html and is valid JSON."; });
  }
  function status(t) { var s = $("status"); s.textContent = t; s.hidden = !t; }

  // ---------- Filtering ----------
  function anyFilter() { return FACETS.some(function (f) { return state.filters[f.key].size; }); }
  function matches(w, skip) {
    return FACETS.every(function (f) {
      if (f.key === skip) return true;
      var set = state.filters[f.key];
      return !set.size || set.has(w[f.key]);
    });
  }
  function shown() { return works.filter(function (w) { return matches(w); }); }

  function domain() {
    if (!works.length) return [1920, NOW_YEAR];
    var mn = Math.min.apply(null, works.map(function (w) { return w.year; }));
    return [Math.floor(mn / 10) * 10, NOW_YEAR];
  }
  function decades() {
    var d = domain(), out = [], vis = shown();
    for (var dec = Math.floor(NOW_YEAR / 10) * 10; dec >= d[0]; dec -= 10) {
      var inDec = function (w) { return w.year >= dec && w.year <= dec + 9; };
      out.push({ dec: dec, list: vis.filter(inDec).sort(byYear), all: works.filter(inDec) });
    }
    return out;
  }

  // ---------- Navigation: decade + one dropdown per tag group ----------
  function closeMenus(except) {
    document.querySelectorAll("#nav details[open]").forEach(function (d) { if (d !== except) d.open = false; });
  }
  function dropdown(key, label, value, items, openKey) {
    var d = h("details", "dd"); d.dataset.key = key;
    if (openKey === key) d.open = true;
    var s = h("summary"); s.appendChild(h("span", null, label));
    if (value) s.appendChild(h("span", "v", value));
    var mk = el("svg", { class: "mk", viewBox: "-5 -5 10 10", "aria-hidden": "true" }, s);
    el("path", { class: "r", d: "M0 0L4 -4M0 0L4 4" }, mk);    // arrowhead: vertex points left, at the label
    el("path", { class: "l", d: "M0 0L-4 -4M0 0L-4 4" }, mk);  // the other half: together they make the ×
    d.appendChild(s);
    var ol = h("ol", "panel");
    items.forEach(function (it) {
      var li = h("li"), b = h("button"); b.type = "button";
      b.appendChild(h("span", "l", it.label));
      b.appendChild(h("span", "n" + (it.n ? "" : " zero"), String(it.n)));
      b.setAttribute("aria-pressed", it.on ? "true" : "false");
      b.addEventListener("click", it.pick);
      li.appendChild(b); ol.appendChild(li);
    });
    d.appendChild(ol);
    d.addEventListener("toggle", function () { if (d.open) closeMenus(d); });
    return d;
  }
  function renderIndex() {
    var nav = $("nav");
    var was = nav.querySelector("details[open]"), openKey = was ? was.dataset.key : null;
    nav.textContent = "";

    // View: list or images
    var vt = h("div", "view"); vt.setAttribute("role", "group"); vt.setAttribute("aria-label", "View");
    [["list", "List"], ["images", "Images"]].forEach(function (o) {
      var b = h("button", null, o[1]); b.type = "button";
      b.setAttribute("aria-pressed", state.view === o[0] ? "true" : "false");
      b.addEventListener("click", function () {
        state.view = o[0]; try { localStorage.setItem("im-view", o[0]); } catch (e) {}
        closeMenus(); hidePeek(); renderAll();
      });
      vt.appendChild(b);
    });
    nav.appendChild(vt);

    // Decade: a jump, so the menu closes after a pick
    nav.appendChild(dropdown("dec", "Decade", state.dec != null ? state.dec + "s" : "", decades().map(function (d) {
      return { label: d.dec + "s", n: d.list.length, on: state.dec === d.dec,
        pick: function () { state.dec = d.dec; closeMenus(); renderIndex(); jumpTo(d.dec); } };
    }), openKey));

    // Tag groups: filters, so the menu stays open for several picks
    FACETS.forEach(function (f) {
      // counts respect the other groups' filters, so you can see what a click will leave
      var counts = {}, values = {};
      works.forEach(function (w) { if (w[f.key] && matches(w, f.key)) counts[w[f.key]] = (counts[w[f.key]] || 0) + 1; });
      works.forEach(function (w) { if (w[f.key]) values[w[f.key]] = true; });
      var keys = Object.keys(values).sort();
      if (!keys.length) return;
      var sel = state.filters[f.key];
      nav.appendChild(dropdown(f.key, f.label, sel.size ? String(sel.size) : "", keys.map(function (v) {
        var on = sel.has(v);
        return { label: v, n: counts[v] || 0, on: on,
          pick: function () { if (on) sel.delete(v); else sel.add(v); state.sel = null; hidePeek(); renderAll(); } };
      }), openKey));
    });

    // Active filters, outside the menus: remove one, or clear all, without reopening anything
    var act = $("active"); act.textContent = ""; act.hidden = !anyFilter();
    if (anyFilter()) {
      act.appendChild(h("span", null, "Showing"));
      FACETS.forEach(function (f) {
        state.filters[f.key].forEach(function (v) {
          var chip = h("button", "chip", v); chip.type = "button";
          chip.setAttribute("aria-label", "Remove filter: " + v);
          chip.addEventListener("click", function () { state.filters[f.key].delete(v); state.sel = null; hidePeek(); renderAll(); });
          act.appendChild(chip);
        });
      });
      var c = h("button", "clear", "Clear filters"); c.type = "button";
      c.addEventListener("click", function () {
        FACETS.forEach(function (f) { state.filters[f.key].clear(); });
        closeMenus(); hidePeek(); renderAll();
      });
      act.appendChild(c);
    }
  }
  document.addEventListener("click", function (e) {
    // a pick re-renders the nav, so its button is already detached by the time the click arrives here
    if (e.target.isConnected && !e.target.closest("#nav")) closeMenus();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenus(); });
  function jumpTo(dec) {
    var col = $("d-" + dec), strip = $("strip");
    if (!col) return;
    strip.scrollTo({ left: col.offsetLeft, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  // ---------- Video player (YouTube / Vimeo) ----------
  // Embed address for the in-place viewer. A click is a request to watch, so sound is on.
  function embedUrl(url) {
    if (!url) return null;
    var m = url.match(/vimeo\.com\/(?:.*\/)?(\d{5,})/);
    if (m) return "https://player.vimeo.com/video/" + m[1] + "?autoplay=1&title=0&byline=0&portrait=0&dnt=1";
    m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    if (m) return "https://www.youtube-nocookie.com/embed/" + m[1] + "?autoplay=1&controls=1&playsinline=1&rel=0";
    return null;
  }
  // Still for image view: an "image" column wins; otherwise taken from the YouTube or Vimeo link
  function thumbUrl(w) {
    if (w.image) return w.image;
    var m = w.url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    if (m) return "https://i.ytimg.com/vi/" + m[1] + "/mqdefault.jpg";
    m = w.url.match(/vimeo\.com\/(?:.*\/)?(\d{5,})/);
    if (m) return "https://vumbnail.com/" + m[1] + ".jpg";
    return null;
  }
  // ---------- Viewer: the work's decade column widens, the rest of the page dims, the video plays in place ----------
  function hidePeek() {}   // kept so older calls stay harmless
  // Changes happen on the elements already on the page (no rebuild), so the column's width
  // transition runs and the player grows out of the entry or still it replaces.
  var calm = function () { return matchMedia("(prefers-reduced-motion: reduce)").matches; };
  var DUR = 360;   // keep in step with --dur
  function afterGrow(col, fn) {
    var done = false, go = function () { if (!done) { done = true; fn(); } };
    if (calm()) return go();
    col.addEventListener("transitionend", function te(e) { if (e.target === col && e.propertyName === "flex-basis") { col.removeEventListener("transitionend", te); go(); } });
    setTimeout(go, DUR + 80);   // fallback
  }
  // Grow or shrink a column about its own centre: each frame the timeline scrolls by half of
  // the width change, so both edges move out (or in) equally. Clamped so the column stays visible.
  function centred(col, until, alive) {
    var strip = $("strip"), s0 = strip.scrollLeft, w0 = col.offsetWidth;
    (function step() {
      if (!col.isConnected) return;   // the timeline was rebuilt; this column no longer exists
      var view = strip.clientWidth, w = col.offsetWidth, l = col.offsetLeft;
      var t = s0 + (w - w0) / 2;
      t = Math.max(t, l + w - view);   // right edge in view
      t = Math.min(t, l);              // left edge in view (wins if the column is wider than the view)
      strip.scrollLeft = Math.max(0, t);
      if (performance.now() < until && alive()) requestAnimationFrame(step);
    })();
  }
  // Opening: while the column grows, the view moves with it so the player ends centred in the
  // window, across and down. p (0 to 1) is how far the column has grown, so the camera move
  // shares the column's easing and both finish together.
  function focusOn(col, li, alive, until) {
    var strip = $("strip"), s0 = strip.scrollLeft, w0 = col.offsetWidth, y0 = scrollY;
    var wEnd = Math.min(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--col-wide")) || 936, innerWidth - 32);
    (function step() {
      if (!col.isConnected || !alive()) return;
      var view = strip.clientWidth, w = col.offsetWidth, l = col.offsetLeft;
      var p = calm() ? 1 : Math.max(0, Math.min(1, (w - w0) / Math.max(1, wEnd - w0)));
      // across: from where it was to the player centred in the timeline, kept inside the column's edges.
      // The player sits inset in its column (year gutter, indent); its final centre is worked out from that inset.
      var pl = li.querySelector(".player"), cr = col.getBoundingClientRect();
      var inL = pl ? pl.getBoundingClientRect().left - cr.left : 0, inR = pl ? cr.right - pl.getBoundingClientRect().right : 0;
      var endCentre = l + inL + (wEnd - inL - inR) / 2;
      var t = s0 + p * ((endCentre - view / 2) - s0);
      t = Math.min(Math.max(t, l + w - view), l);
      strip.scrollLeft = Math.max(0, t);
      // down: towards the player centred in the window (top never above the window's top)
      if (pl) {
        var b = pl.getBoundingClientRect();
        var centre = scrollY + b.top + b.height / 2 - innerHeight / 2;
        var topLine = scrollY + b.top - 24;
        window.scrollTo(0, y0 + p * (Math.min(centre, topLine) - y0));
      }
      if (performance.now() < until) requestAnimationFrame(step);
    })();
  }
  function play(id) {
    if (state.playing === id) return;
    if (state.playing) { state.playing = null; renderStrip(); }   // switching: the old one closes at once
    var w = works.filter(function (x) { return x.id === id; })[0], src = w && embedUrl(w.url);
    var li = $("w-" + id), col = li && li.closest(".dec");
    if (!src || !li || !col) return;
    state.playing = id; state.sel = id; closeMenus();

    // Stage 1: build the player where the entry is
    li.classList.add("playing", "sel");
    if (li.classList.contains("img")) {
      var fig = li.querySelector(".thumb"), pl = player(w, src);
      li.replaceChild(pl, fig);
      var cap = h("div", "cap"); cap.appendChild(h("span", "y", String(w.year))); cap.appendChild(h("span", null, w.note || ""));
      li.appendChild(cap);
      li.removeAttribute("tabindex");
    } else {
      li.querySelector("div").appendChild(player(w, src));
    }
    // Stage 2: widen the column and dim the rest, together
    col.classList.add("wide");
    document.body.classList.add("theatre");
    // Stage 3: the view moves with the growing column and settles with the player centred
    focusOn(col, li, function () { return state.playing === id; }, performance.now() + (calm() ? 0 : DUR + 60));
  }
  function stop() {
    if (!state.playing) return;
    var id = state.playing, li = $("w-" + id), col = li && li.closest(".dec");
    state.playing = null;
    if (!col) { renderStrip(); return; }
    // Reverse: the column narrows (the player shrinks with it) and the page lights up, then the entry is rebuilt
    var f = li.querySelector("iframe"); if (f) f.remove();   // stop the sound at once
    col.classList.remove("wide");
    document.body.classList.remove("theatre");
    centred(col, performance.now() + (calm() ? 0 : DUR + 60), function () { return !state.playing; });   // shrinks about its centre too
    afterGrow(col, function () { if (!state.playing) renderStrip(); });
  }
  function player(w, src) {
    var box = h("div", "player");
    var bar = h("div", "bar");
    bar.appendChild(h("span", null, w.title + (w.maker ? " — " + w.maker : "")));
    var x = h("button", "x"); x.type = "button"; x.setAttribute("aria-label", "Close video");
    var xs = el("svg", { viewBox: "-4 -4 8 8", "aria-hidden": "true" }, x);
    el("path", { d: "M-4 -4L4 4M-4 4L4 -4" }, xs);
    x.addEventListener("click", function (e) { e.stopPropagation(); stop(); });
    bar.appendChild(x);
    var frame = h("div", "frame"), f = document.createElement("iframe");
    f.src = src; f.title = w.title;
    f.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media"; f.allowFullscreen = true;
    frame.appendChild(f); box.appendChild(bar); box.appendChild(frame);
    box.addEventListener("click", function (e) { e.stopPropagation(); });
    return box;
  }
  // Clicking an entry plays it in place; a link that can't be embedded opens in a new tab
  function open(w, src) {
    if (src) { play(w.id); return; }
    if (w.url) window.open(w.url, "_blank", "noopener");
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") stop(); });
  document.addEventListener("click", function (e) {
    // a click on the dimmed page closes the viewer; picks inside re-render first, so their target is detached
    if (state.playing && e.target.isConnected && !e.target.closest(".player, #nav")) stop();
  });

  // ---------- Strip ----------
  var RAD = 3.5, GAPV = RAD * 2 + 2.5;
  var COL = 312, COL_EMPTY = 96;   // keep in step with --col / --col-empty
  // A cross centred on (cx, cy), arm length a
  function cross(cx, cy, a, cls, parent) {
    return el("path", { d: "M" + (cx - a) + " " + (cy - a) + "L" + (cx + a) + " " + (cy + a) + "M" + (cx - a) + " " + (cy + a) + "L" + (cx + a) + " " + (cy - a), class: cls }, parent);
  }
  function ruler(dec, list, all, W, axisY) {
    // ten years, newest on the left; filtered-out works stay as faint marks on the line
    var x0 = 0, x1 = W, H = axisY + 16;
    var sx = function (y) { return x1 - (y - dec) / 10 * (x1 - x0); }; // y = start of year
    var svg = el("svg", { viewBox: "0 0 " + W + " " + H, role: "group", "aria-label": dec + "s, " + list.length + " works" });
    el("line", { x1: x0, x2: x1, y1: axisY, y2: axisY, stroke: "var(--hair)", "stroke-width": 0.5 }, svg);
    for (var y = dec; y <= dec + 9; y++) {
      if (y > NOW_YEAR) continue;
      var tx = sx(y), isDec = y === dec, mid = y === dec + 5;
      if (!isDec) el("line", { x1: tx, x2: tx, y1: axisY, y2: axisY + (mid ? 5 : 3), stroke: "var(--hair)", "stroke-width": 0.5 }, svg);
      if (isDec) el("text", { x: W - 4, y: axisY + 13, "text-anchor": "end", class: "ax-strong" }, svg).textContent = y;
      else if (mid && W > 150) el("text", { x: tx, y: axisY + 13, "text-anchor": "middle", class: "ax" }, svg).textContent = y;
    }
    var stacks = {}; list.forEach(function (w) { (stacks[w.year] = stacks[w.year] || []).push(w); });
    if (anyFilter()) {
      var shownIds = {}; list.forEach(function (w) { shownIds[w.id] = true; });
      var ghosts = {};
      all.forEach(function (w) { if (!shownIds[w.id]) ghosts[w.year] = (ghosts[w.year] || 0) + 1; });
      Object.keys(ghosts).forEach(function (yk) {
        var base = (stacks[yk] || []).length;
        for (var i = 0; i < ghosts[yk]; i++) cross(sx(+yk + 0.5), axisY - 4 - RAD - (base + i) * GAPV, 1.75, "ghost", svg);
      });
    }
    Object.keys(stacks).forEach(function (yk) {
      stacks[yk].forEach(function (w, i) {
        var g = el("g", { class: "dot" + (state.sel === w.id ? " sel" : ""), tabindex: 0, role: "button", "aria-label": w.year + ", " + w.title }, svg);
        el("title", {}, g).textContent = w.year + " · " + w.title + (w.maker ? " — " + w.maker : "");
        var cx = sx(w.year + 0.5), cy = axisY - 4 - RAD - i * GAPV;
        el("circle", { cx: cx, cy: cy, r: RAD + 1, fill: "transparent" }, g);   // hit area, so the thin cross is easy to click
        cross(cx, cy, 2.5, "x", g);
        var pick = function () { select(w.id); };
        g.addEventListener("click", pick);
        g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
      });
    });
    return svg;
  }

  function renderStrip() {
    var row = $("row"), keep = $("strip").scrollLeft; row.textContent = "";
    var per = {}, gMax = 1;
    works.forEach(function (w) { per[w.year] = (per[w.year] || 0) + 1; gMax = Math.max(gMax, per[w.year]); });
    var axisY = Math.max(22, gMax * GAPV + 10);
    row.style.setProperty("--axis", axisY + "px");
    decades().forEach(function (d) {
      var playingHere = state.playing && d.list.some(function (w) { return w.id === state.playing; });
      var col = h("section", "dec" + (d.list.length ? "" : " empty") + (playingHere ? " wide" : "")); col.id = "d-" + d.dec;
      var r = h("div", "ruler"); r.appendChild(ruler(d.dec, d.list, d.all, d.list.length ? COL : COL_EMPTY, axisY)); col.appendChild(r);
      if (!d.list.length) { col.appendChild(h("p", "none", anyFilter() && d.all.length ? "Nothing matching" : "Nothing recorded")); row.appendChild(col); return; }
      var ol = h("ol", "works");
      d.list.forEach(function (w) {
        if (state.view === "images") { ol.appendChild(imageTile(w)); return; }
        var li = h("li", "work" + (state.sel === w.id ? " sel" : "") + (state.playing === w.id ? " playing" : "")); li.id = "w-" + w.id;
        li.appendChild(h("span", "y", String(w.year)));
        var body = h("div"); body.style.minWidth = "0";
        var t = h("div", "t", w.title); body.appendChild(t);
        var src = embedUrl(w.url);
        if (src) t.classList.add("playable");
        if (w.maker) body.appendChild(h("div", "m", w.maker));
        if (w.note) body.appendChild(h("p", null, w.note));
        if (state.playing === w.id) body.appendChild(player(w, src));
        li.appendChild(body);
        if (state.playing !== w.id) {
          li.tabIndex = 0; li.setAttribute("role", "button");
          li.setAttribute("aria-label", "Play " + w.title + (w.maker ? ", " + w.maker : ""));
          li.addEventListener("click", function (e) { e.stopPropagation(); open(w, src); });
          li.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target === li) { e.preventDefault(); open(w, src); } });
        }
        ol.appendChild(li);
      });
      col.appendChild(ol); row.appendChild(col);
    });
    $("strip").scrollLeft = keep;
    document.body.classList.toggle("theatre", !!state.playing);
  }

  // Image view: one still per work; details appear on hover or keyboard focus
  function imageTile(w) {
    var src0 = embedUrl(w.url);
    if (state.playing === w.id && src0) {
      var pli = h("li", "work img playing"); pli.id = "w-" + w.id;
      pli.appendChild(player(w, src0));
      var cap = h("div", "cap"); cap.appendChild(h("span", "y", String(w.year))); cap.appendChild(h("span", null, w.note || ""));
      pli.appendChild(cap);
      return pli;
    }
    var li = h("li", "work img" + (state.sel === w.id ? " sel" : "")); li.id = "w-" + w.id; li.tabIndex = 0;
    li.setAttribute("aria-label", w.year + ", " + w.title + (w.maker ? ", " + w.maker : ""));
    var fig = h("div", "thumb"), src = embedUrl(w.url), still = thumbUrl(w);
    var fall = h("div", "fallback"); fall.appendChild(h("span", "y", String(w.year))); fall.appendChild(h("span", "ft", w.title));
    fig.appendChild(fall);
    if (still) {
      var img = document.createElement("img"); img.alt = ""; img.loading = "lazy"; img.decoding = "async"; img.src = still;
      img.addEventListener("error", function () { img.remove(); });
      fig.appendChild(img);
    }
    var info = h("div", "info");
    info.appendChild(h("span", "y", String(w.year)));
    var t = h("div", "t" + (src ? " playable" : ""), w.title); info.appendChild(t);
    if (w.maker) info.appendChild(h("div", "m", w.maker));
    if (w.note) info.appendChild(h("p", null, w.note));
    fig.appendChild(info);
    li.appendChild(fig);
    li.addEventListener("click", function (e) { e.stopPropagation(); open(w, src); });
    li.addEventListener("keydown", function (e) { if ((e.key === "Enter" || e.key === " ") && e.target === li) { e.preventDefault(); open(w, src); } });
    return li;
  }

  function select(id) {
    var w = works.filter(function (x) { return x.id === id; })[0];
    if (w && embedUrl(w.url)) { play(id); return; }
    state.sel = state.sel === id ? null : id;
    renderStrip();
    var n = state.sel && $("w-" + id);
    if (n) n.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "auto" });
  }

  function renderAll() { renderIndex(); renderStrip(); }
  load();
})();
</script>
</body>
